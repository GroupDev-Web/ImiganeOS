name: Build ImagineOS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'website/**'
      - 'index.html'
      - 'site.css'
      - 'site.js'
  workflow_dispatch:
    inputs:
      edition:
        description: Windows experience to build, or all
        type: choice
        default: all
        options: [all, win95, winxp, win7, win10, vista, win11]
      architecture:
        description: Processor architecture, or all
        type: choice
        default: all
        options: [all, amd64, i386]
      version:
        description: Version label used in artifact filenames
        type: string
        default: 1.0-beta

permissions:
  contents: read

concurrency:
  group: imagineos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: win95, arch: amd64, label: 'Windows 95 · x86_64', artifact: ImagineOS-Windows-95-x86_64 }
          - { edition: winxp, arch: amd64, label: 'Windows XP · x86_64', artifact: ImagineOS-Windows-XP-x86_64 }
          - { edition: win7, arch: amd64, label: 'Windows 7 · x86_64', artifact: ImagineOS-Windows-7-x86_64 }
          - { edition: win10, arch: amd64, label: 'Windows 10 · x86_64', artifact: ImagineOS-Windows-10-x86_64 }
          - { edition: vista, arch: amd64, label: 'Windows Vista · x86_64', artifact: ImagineOS-Windows-Vista-x86_64 }
          - { edition: win11, arch: amd64, label: 'Windows 11 · x86_64', artifact: ImagineOS-Windows-11-x86_64 }
          - { edition: win95, arch: i386, label: 'Windows 95 · x86', artifact: ImagineOS-Windows-95-x86 }
          - { edition: winxp, arch: i386, label: 'Windows XP · x86', artifact: ImagineOS-Windows-XP-x86 }
          - { edition: win7, arch: i386, label: 'Windows 7 · x86', artifact: ImagineOS-Windows-Windows-7-x86 }
          - { edition: win10, arch: i386, label: 'Windows 10 · x86', artifact: ImagineOS-Windows-10-x86 }
          - { edition: vista, arch: i386, label: 'Windows Vista · x86', artifact: ImagineOS-Windows-Vista-x86 }
          - { edition: win11, arch: i386, label: 'Windows 11 · x86', artifact: ImagineOS-Windows-11-x86 }

    steps:
      - name: Check requested build selection
        id: selected
        shell: bash
        run: |
          edition="${{ github.event.inputs.edition || 'all' }}"
          architecture="${{ github.event.inputs.architecture || 'all' }}"
          if [[ "$edition" != all && "$edition" != '${{ matrix.edition }}' ]]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          elif [[ "$architecture" != all && "$architecture" != '${{ matrix.arch }}' ]]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out ImagineOS
        if: steps.selected.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Make room for the ISO build
        if: steps.selected.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install image-building dependencies
        if: steps.selected.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso mtools dosfstools rsync \
            grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin \
            imagemagick librsvg2-bin fonts-dejavu-core

      - name: Build bootable live ISO
        if: steps.selected.outputs.build == 'true'
        run: |
          chmod +x scripts/*.sh
          sudo ./scripts/build.sh \
            --edition '${{ matrix.edition }}' \
            --arch '${{ matrix.arch }}' \
            --version '${{ github.event.inputs.version || '1.0-beta' }}'
          sudo chown -R "$USER:$USER" dist

      - name: Verify ISO and SHA256
        if: steps.selected.outputs.build == 'true'
        run: |
          find dist -maxdepth 1 -type f -print
          test "$(find dist -maxdepth 1 -name '*.iso' | wc -l)" -eq 1
          cd dist
          sha256sum -c ./*.sha256

      - name: Upload ImagineOS artifact
        if: steps.selected.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.iso
            dist/*.iso.sha256
            dist/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
