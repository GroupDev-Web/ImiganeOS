name: Validate ImiganeOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          bash -n scripts/build.sh scripts/customize-chroot.sh scripts/generate-assets.sh
          shellcheck -x scripts/*.sh
      - name: Check operating-system build matrix
        run: python3 scripts/validate.py
