---
modules-search: [ local, /usr/lib/calamares/modules, /usr/lib64/calamares/modules ]
instances: []
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - umount
  - show:
      - finished
branding: imiganeos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
hide-back-and-next-during-exec: true
