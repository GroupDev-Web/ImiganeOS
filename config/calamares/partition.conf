---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 32MiB
  label: "EFI"

userSwapChoices:
  - none
  - small
  - suspend

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
initialSwapChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes:
  - ext4
  - btrfs

# Do not let Calamares confuse the live medium / Ventoy mappings with
# installation targets while clearing mounts before partitioning.
essentialMounts:
  - "live-*"
  - "control"
  - "ventoy"
  - "squashfs"

lvm:
  enable: true

# Used by the partition page to offer erase / alongside / replace choices.
requiredStorage: 12
